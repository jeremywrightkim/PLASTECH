<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" preserveAspectRatio="xMidYMid slice">
  <!-- PRODUCT GRID 3/4 — 플라스틱 수지 / Plastic Resins.
       Motif: a polymer backbone of linked hexagons above a bed of resin pellets —
       the feedstock we actually ship (PPE, Ultramid PA6, MX Nylon). Teal, matching
       hero-2. Text-free by design; see product-1.svg for the reasoning. -->
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07564e"/><stop offset="1" stop-color="#12b0a0"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c8fff5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#c8fff5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg3)"/>
  <rect width="600" height="450" fill="url(#glow3)"/>

  <g fill="#ffffff" opacity="0.07">
    <circle cx="500" cy="80" r="150"/><circle cx="80" cy="380" r="110"/>
  </g>

  <!-- polymer backbone: hexagon repeat units joined by bonds -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.3" fill="none">
    <path d="M126 150 H174"/><path d="M258 150 H306"/><path d="M390 150 H438"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.62">
    <polygon points="216,108 246,129 246,171 216,192 186,171 186,129"/>
    <polygon points="348,108 378,129 378,171 348,192 318,171 318,129"/>
    <polygon points="480,108 510,129 510,171 480,192 450,171 450,129"/>
    <polygon points="84,108 114,129 114,171 84,192 54,171 54,129"/>
  </g>
  <g fill="#c8fff5" opacity="0.5">
    <circle cx="216" cy="150" r="7"/><circle cx="348" cy="150" r="7"/>
    <circle cx="480" cy="150" r="7"/><circle cx="84" cy="150" r="7"/>
  </g>

  <!-- pellet bed: lens-shaped resin granules -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="112" cy="300" rx="34" ry="21" transform="rotate(-14 112 300)"/>
    <ellipse cx="196" cy="284" rx="34" ry="21" transform="rotate(10 196 284)"/>
    <ellipse cx="282" cy="304" rx="34" ry="21" transform="rotate(-6 282 304)"/>
    <ellipse cx="368" cy="282" rx="34" ry="21" transform="rotate(16 368 282)"/>
    <ellipse cx="452" cy="302" rx="34" ry="21" transform="rotate(-10 452 302)"/>
    <ellipse cx="154" cy="366" rx="34" ry="21" transform="rotate(6 154 366)"/>
    <ellipse cx="240" cy="380" rx="34" ry="21" transform="rotate(-18 240 380)"/>
    <ellipse cx="326" cy="364" rx="34" ry="21" transform="rotate(12 326 364)"/>
    <ellipse cx="412" cy="380" rx="34" ry="21" transform="rotate(-4 412 380)"/>
    <ellipse cx="498" cy="362" rx="34" ry="21" transform="rotate(14 498 362)"/>
  </g>
  <g fill="#07564e" opacity="0.28">
    <ellipse cx="112" cy="300" rx="13" ry="8" transform="rotate(-14 112 300)"/>
    <ellipse cx="282" cy="304" rx="13" ry="8" transform="rotate(-6 282 304)"/>
    <ellipse cx="452" cy="302" rx="13" ry="8" transform="rotate(-10 452 302)"/>
    <ellipse cx="240" cy="380" rx="13" ry="8" transform="rotate(-18 240 380)"/>
    <ellipse cx="412" cy="380" rx="13" ry="8" transform="rotate(-4 412 380)"/>
  </g>
</svg>
