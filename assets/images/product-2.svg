<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" preserveAspectRatio="xMidYMid slice">
  <!-- PRODUCT GRID 2/4 — 플라스틱 첨가제 / Plastic Additives.
       Motif: masterbatch pellets on the left dispersing into fine particles on the
       right — what an additive does in a compound. Brand blue, matching hero-1.
       Text-free by design; see product-1.svg for the reasoning. -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062f5c"/><stop offset="1" stop-color="#0b5cab"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#8fd4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8fd4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg2)"/>
  <rect width="600" height="450" fill="url(#glow2)"/>

  <g fill="#ffffff" opacity="0.07">
    <circle cx="500" cy="80" r="150"/><circle cx="80" cy="380" r="110"/>
  </g>

  <!-- pellets: cylindrical masterbatch granules, lightly rotated -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="132" cy="176" rx="38" ry="24" transform="rotate(-18 132 176)"/>
    <ellipse cx="212" cy="140" rx="38" ry="24" transform="rotate(12 212 140)"/>
    <ellipse cx="118" cy="256" rx="38" ry="24" transform="rotate(8 118 256)"/>
    <ellipse cx="204" cy="228" rx="38" ry="24" transform="rotate(-26 204 228)"/>
    <ellipse cx="150" cy="330" rx="38" ry="24" transform="rotate(-6 150 330)"/>
    <ellipse cx="238" cy="312" rx="38" ry="24" transform="rotate(20 238 312)"/>
  </g>
  <!-- highlight so the granules read as solid, not flat -->
  <g fill="#8fd4ff" opacity="0.55">
    <ellipse cx="126" cy="170" rx="16" ry="9" transform="rotate(-18 126 170)"/>
    <ellipse cx="206" cy="134" rx="16" ry="9" transform="rotate(12 206 134)"/>
    <ellipse cx="144" cy="324" rx="16" ry="9" transform="rotate(-6 144 324)"/>
  </g>

  <!-- dispersion: particles thinning out to the right -->
  <g fill="#ffffff">
    <circle cx="304" cy="180" r="11" opacity="0.62"/>
    <circle cx="352" cy="248" r="9" opacity="0.55"/>
    <circle cx="330" cy="316" r="8" opacity="0.5"/>
    <circle cx="398" cy="150" r="8" opacity="0.48"/>
    <circle cx="424" cy="286" r="7" opacity="0.44"/>
    <circle cx="452" cy="204" r="6" opacity="0.4"/>
    <circle cx="498" cy="330" r="6" opacity="0.34"/>
    <circle cx="512" cy="150" r="5" opacity="0.32"/>
    <circle cx="546" cy="252" r="5" opacity="0.28"/>
    <circle cx="470" cy="98" r="4" opacity="0.26"/>
    <circle cx="566" cy="374" r="4" opacity="0.22"/>
  </g>
</svg>
