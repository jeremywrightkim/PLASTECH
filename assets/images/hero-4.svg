<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!-- Slide — SAYTEX ALERO, polymeric flame retardant. Background only; a flame
       held inside a shield, with a polymer chain running behind it. Artwork is
       kept to the right of the copy column so nothing sits behind the text. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a06"/><stop offset="1" stop-color="#b8760f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- polymer chain — the "polymeric FR" motif -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.20" fill="none">
    <path d="M950 690 L1070 610 L1190 690 L1310 610 L1430 690 L1550 610"/>
    <path d="M1010 240 L1130 320 L1250 240 L1370 320 L1490 240"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="950" cy="690" r="9"/><circle cx="1070" cy="610" r="9"/>
    <circle cx="1190" cy="690" r="9"/><circle cx="1310" cy="610" r="9"/>
    <circle cx="1430" cy="690" r="9"/>
    <circle cx="1010" cy="240" r="8"/><circle cx="1130" cy="320" r="8"/>
    <circle cx="1250" cy="240" r="8"/><circle cx="1370" cy="320" r="8"/>
  </g>

  <!-- soft orb behind the shield -->
  <circle cx="1240" cy="460" r="250" fill="#ffffff" opacity="0.07"/>

  <!-- shield: the flame is contained, not fed -->
  <path d="M1240 300 L1400 356 V498 C1400 578 1330 630 1240 664
           C1150 630 1080 578 1080 498 V356 Z"
        fill="none" stroke="#ffe6b8" stroke-width="3" opacity="0.45"/>

  <!-- flame -->
  <path d="M1240 380 C1288 432 1312 470 1312 508 C1312 556 1280 588 1240 588
           C1200 588 1168 556 1168 508 C1168 470 1192 432 1240 380 Z"
        fill="#ffd98a" opacity="0.42"/>
  <path d="M1240 452 C1264 484 1274 504 1274 524 C1274 550 1259 566 1240 566
           C1221 566 1206 550 1206 524 C1206 504 1216 484 1240 452 Z"
        fill="#fff4dc" opacity="0.55"/>
</svg>
