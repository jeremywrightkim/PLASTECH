<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" preserveAspectRatio="xMidYMid slice">
  <!-- PRODUCT GRID 1/4 — 난연제 / Flame Retardants.
       Motif: a flame held inside a shield (the retardant contains fire rather than
       feeding it) over a polymer chain, echoing hero-4.svg which carries the ALERO
       slide. Amber, so the four product cards read as four distinct lines.
       Deliberately text-free: one file serves both the Korean and English pages, and
       .prod-card already prints a heading and description beneath it. -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a06"/><stop offset="1" stop-color="#b8760f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg1)"/>
  <rect width="600" height="450" fill="url(#glow1)"/>

  <!-- soft backdrop orbs, same construction on all four cards -->
  <g fill="#ffffff" opacity="0.07">
    <circle cx="500" cy="80" r="150"/><circle cx="80" cy="380" r="110"/>
  </g>

  <!-- polymer chain -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.22" fill="none">
    <path d="M40 392 L130 350 L220 392 L310 350 L400 392 L490 350 L570 388"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="130" cy="350" r="8"/><circle cx="220" cy="392" r="8"/>
    <circle cx="310" cy="350" r="8"/><circle cx="400" cy="392" r="8"/>
    <circle cx="490" cy="350" r="8"/>
  </g>

  <!-- shield -->
  <path d="M300 78 L392 112 V216 C392 276 352 310 300 332 C248 310 208 276 208 216 V112 Z"
        fill="#ffffff" opacity="0.08"/>
  <path d="M300 78 L392 112 V216 C392 276 352 310 300 332 C248 310 208 276 208 216 V112 Z"
        fill="none" stroke="#ffe6b8" stroke-width="3.5" opacity="0.55"/>

  <!-- flame -->
  <path d="M300 138 C332 178 348 206 348 232 C348 265 326 286 300 286
           C274 286 252 265 252 232 C252 206 268 178 300 138 Z"
        fill="#ffd98a" opacity="0.5"/>
  <path d="M300 194 C316 216 324 232 324 246 C324 264 314 276 300 276
           C286 276 276 264 276 246 C276 232 284 216 300 194 Z"
        fill="#fff4dc" opacity="0.72"/>
</svg>
