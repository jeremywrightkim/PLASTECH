<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!-- Slide 2 — Global partnership. Background only; a connected-node motif
       suggesting the supply network, kept clear of the copy column. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07564e"/><stop offset="1" stop-color="#12b0a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c8fff5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#c8fff5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- network links -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.22" fill="none">
    <path d="M980 620 L1180 300 L1420 470 L1330 700 L980 620 Z"/>
    <path d="M1180 300 L1330 700"/>
    <path d="M980 620 L1420 470"/>
    <path d="M1180 300 L1520 200"/>
    <path d="M1420 470 L1520 200"/>
  </g>
  <!-- large soft orbs -->
  <g fill="#ffffff" opacity="0.07">
    <circle cx="1260" cy="400" r="250"/>
    <circle cx="1020" cy="720" r="130"/>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="980" cy="620" r="10"/>
    <circle cx="1180" cy="300" r="14"/>
    <circle cx="1420" cy="470" r="11"/>
    <circle cx="1330" cy="700" r="9"/>
    <circle cx="1520" cy="200" r="8"/>
  </g>
</svg>
