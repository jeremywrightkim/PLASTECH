<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" preserveAspectRatio="xMidYMid slice">
  <!-- SAYTEX ALERO spotlight visual, 3:4 portrait to match .spec-split .visual.
       Placeholder artwork in the site's own palette — swap for the manufacturer's
       product photography or brochure cover when licensed assets are available. -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b5cab"/><stop offset="1" stop-color="#062f5c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#sheet)"/>

  <!-- top band: application imagery stand-in (E&E / automotive / building) -->
  <rect x="0" y="0" width="600" height="250" fill="url(#band)"/>
  <g opacity="0.20" fill="none" stroke="#ffffff" stroke-width="3">
    <!-- circuit trace motif -->
    <path d="M60 190 H160 V120 H250"/>
    <path d="M250 190 H340 V140 H430 V196"/>
    <path d="M430 110 H540"/>
    <path d="M60 120 H110"/>
  </g>
  <g fill="#8fd4ff" opacity="0.75">
    <circle cx="160" cy="120" r="7"/><circle cx="250" cy="190" r="7"/>
    <circle cx="340" cy="140" r="7"/><circle cx="430" cy="196" r="7"/>
    <circle cx="540" cy="110" r="7"/>
  </g>
  <!-- diagonal cut, echoing the brochure layout -->
  <path d="M0 250 L600 190 L600 250 Z" fill="#ffffff" opacity="0.9"/>

  <!-- wordmark -->
  <text x="60" y="380" font-family="Segoe UI, Malgun Gothic, sans-serif"
        font-size="52" font-weight="800" fill="#062f5c" letter-spacing="1">SAYTEX</text>
  <text x="60" y="446" font-family="Segoe UI, Malgun Gothic, sans-serif"
        font-size="52" font-weight="800" fill="#0b5cab" letter-spacing="1">ALERO<tspan font-size="24" dy="-22">&#174;</tspan></text>
  <rect x="60" y="474" width="96" height="4" fill="#0b5cab"/>
  <text x="60" y="518" font-family="Segoe UI, Malgun Gothic, sans-serif"
        font-size="20" font-style="italic" fill="#5b7086">Modern fire safety,</text>
  <text x="60" y="548" font-family="Segoe UI, Malgun Gothic, sans-serif"
        font-size="20" font-style="italic" fill="#5b7086">advanced sustainability</text>

  <!-- polymer chain, the "polymeric FR" cue -->
  <g stroke="#0b5cab" stroke-width="2.5" opacity="0.35" fill="none">
    <path d="M60 640 L140 596 L220 640 L300 596 L380 640 L460 596 L540 640"/>
  </g>
  <g fill="#0b5cab" opacity="0.55">
    <circle cx="60" cy="640" r="8"/><circle cx="140" cy="596" r="8"/>
    <circle cx="220" cy="640" r="8"/><circle cx="300" cy="596" r="8"/>
    <circle cx="380" cy="640" r="8"/><circle cx="460" cy="596" r="8"/>
    <circle cx="540" cy="640" r="8"/>
  </g>

  <!-- footer strip -->
  <rect x="0" y="716" width="600" height="84" fill="#f2f6fb"/>
  <text x="60" y="766" font-family="Segoe UI, Malgun Gothic, sans-serif"
        font-size="20" font-weight="700" fill="#5b7086" letter-spacing="2">ALBEMARLE</text>
</svg>
